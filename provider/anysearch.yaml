        rate limits; the API also has an anonymous tier).
      zh_Hans: 从 AnySearch 控制台获取 API key（配置 key 可提升速率限制；API 也支持匿名访问）。
    label:
      en_US: AnySearch API key
      zh_Hans: AnySearch API key
